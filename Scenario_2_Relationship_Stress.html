document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<div style=\"position: absolute; inset: 0; display: flex; background: #ececec; animation: t2u-fade .3s ease-out;\">\n\n        <div style=\"width: 148px; flex-shrink: 0; background: #fbbccb; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 12px;\">\n          <div style=\"font-family: inherit; font-size: 13px; font-weight: 600; color: #2a2a2a; background: linear-gradient(100deg, #f9a8c0, #f6b17e); border-radius: 8px; padding: 11px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12);\">\n            <span style=\"font-size: 16px; line-height: 1;\">+<\u002Fspan> New chat\n          <\u002Fdiv>\n          <div style=\"font-family: inherit; font-size: 12px; font-weight: 500; color: #3a2a2e; background: linear-gradient(100deg, #f7bcc9, #f8c4a8); border-radius: 8px; padding: 11px 10px; display: flex; align-items: center; gap: 7px;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a2a2e\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18\"><\u002Fpath><path d=\"M6 21v-16a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v16\"><\u002Fpath><path d=\"M14 12v.01\"><\u002Fpath><\u002Fsvg>\n            Back to main menu\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative;\">\n          <div style=\"padding: 12px 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;\">\n            <span style=\"font-size: 18px; color: #333;\">←|<\u002Fspan>\n          <\u002Fdiv>\n\n          <div ref=\"{{ scrollRef }}\" style=\"flex: 1; overflow-y: auto; padding: 4px 32px 12px; display: flex; flex-direction: column; gap: 14px;\">\n            <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"0\">\n              <div style=\"display: flex; justify-content: {{ m.justify }}; width: 100%;\">\n                <div style=\"display: flex; align-items: flex-start; gap: 9px; max-width: 62%; flex-direction: {{ m.dir }}; animation: t2u-pop .28s ease-out;\">\n                  <div style=\"width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: {{ m.avaColor }}; background: {{ m.avaBg }};\">{{ m.avaText }}<\u002Fdiv>\n                  <div style=\"background: #fff; color: #232323; font-size: 14px; line-height: 1.5; padding: 10px 14px; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); white-space: pre-wrap;\">{{ m.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ showTyping }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; justify-content: flex-start; width: 100%;\">\n                <div style=\"display: flex; align-items: center; gap: 9px;\">\n                  <div style=\"width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #1f6b45; background: #a6e6bf;\">T<\u002Fdiv>\n                  <div style=\"background: #fff; padding: 13px 15px; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); display: flex; gap: 5px;\">\n                    <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; animation: t2u-bounce 1.2s infinite;\"><\u002Fspan>\n                    <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; animation: t2u-bounce 1.2s infinite; animation-delay: .2s;\"><\u002Fspan>\n                    <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; animation: t2u-bounce 1.2s infinite; animation-delay: .4s;\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- END-OF-CONVERSATION CARD -->\n            <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin: 14px 0 4px; display: flex; justify-content: center; animation: t2u-pop .35s ease-out;\">\n                <div style=\"width: 100%; max-width: 620px; background: #fff; border: 2px solid #a6e6bf; border-radius: 14px; padding: 22px 26px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.08);\">\n                  <div style=\"width: 40px; height: 40px; margin: 0 auto 12px; border-radius: 50%; background: #a6e6bf; display: flex; align-items: center; justify-content: center;\">\n                    <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1f6b45\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 17px; font-weight: 700; color: #1c1c1c;\">End of conversation<\u002Fdiv>\n                  <div style=\"margin-top: 8px; font-size: 14px; line-height: 1.55; color: #444;\">You have reached the end of the conversation. Please continue to the next section of the survey.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- INPUT + NEXT -->\n          <div style=\"flex-shrink: 0; padding: 12px 24px 8px;\">\n            <div style=\"background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px 18px; font-size: 14px; color: {{ inputColor }}; min-height: 50px; display: flex; align-items: center; white-space: pre-wrap;\">{{ inputDisplay }}<\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 16px;\">\n              <div style=\"display: flex; gap: 10px; flex-shrink: 0;\">\n                <div style=\"font-family: inherit; font-size: 12px; font-weight: 600; color: #1f6b45; background: #a6e6bf; border-radius: 6px; padding: 8px 14px;\">Partner with us!<\u002Fdiv>\n                <div style=\"font-family: inherit; font-size: 12px; font-weight: 500; color: #555; background: #e6e6e6; border-radius: 6px; padding: 8px 14px;\">Give us a feedback<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 14px; min-width: 0;\">\n                <span style=\"font-size: 13px; color: #555555; text-align: right;\">{{ hintText }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onNext }}\" disabled=\"{{ nextDisabled }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: .2px; color: {{ nextColor }}; background: {{ nextBg }}; border: none; border-radius: 8px; padding: 12px 28px; cursor: {{ nextCursor }}; opacity: {{ nextOpacity }}; box-shadow: 0 2px 6px rgba(0,0,0,.14); display: flex; align-items: center; gap: 8px; flex-shrink: 0; transition: opacity .2s ease; animation: {{ nextAnim }};\">{{ nextLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align: center; font-size: 11px; color: #9a9a9a; margin-top: 8px;\">v4.2&nbsp;&nbsp;Terms and conditions<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- DISCLAIMER MODAL -->\n        <sc-if value=\"{{ showModal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(120,120,120,.55); display: flex; align-items: center; justify-content: center; padding: 40px; animation: t2u-fade .25s ease-out;\">\n            <div style=\"width: 660px; max-width: 100%; max-height: 100%; background: #ededed; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; animation: t2u-modal .3s ease-out;\">\n              <div style=\"padding: 22px 26px 16px; border-bottom: 1px solid #dcdcdc;\">\n                <h2 style=\"margin: 0; font-size: 22px; font-weight: 700; color: #1c1c1c;\">Disclaimer<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"flex: 1; overflow-y: auto; padding: 20px 26px; display: flex; flex-direction: column; gap: 14px;\">\n                <sc-for list=\"{{ disclaimer }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55; color: #333;\">{{ p }}<\u002Fp>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding: 14px 26px; border-top: 1px solid #dcdcdc; display: flex; justify-content: space-between; align-items: center; gap: 16px;\">\n                <span style=\"font-size: 13px; color: #555555;\">Read at your own pace, then continue.<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onAgree }}\" style=\"font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .5px; color: #7a2f57; background: #f9c6da; border: none; border-radius: 7px; padding: 11px 22px; cursor: pointer;\">I AGREE<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ATTENTION CHECK -->\n        <sc-if value=\"{{ showCheck }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(60,60,60,.62); display: flex; align-items: center; justify-content: center; padding: 40px; animation: t2u-fade .25s ease-out; z-index: 20;\">\n            <div style=\"width: 520px; max-width: 100%; background: #ffffff; border-radius: 12px; box-shadow: 0 14px 44px rgba(0,0,0,.34); padding: 30px 34px 28px; text-align: center; animation: t2u-modal .3s ease-out;\">\n              <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #7a2f57;\">Attention check<\u002Fdiv>\n              <div style=\"margin-top: 12px; font-size: 18px; font-weight: 600; line-height: 1.45; color: #1c1c1c;\">To continue, please click the button below 10 times.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onCheckClick }}\" style=\"font-family: inherit; margin-top: 22px; width: 100%; font-size: 16px; font-weight: 700; color: #ffffff; background: linear-gradient(90deg, #f9a8c0, #f6b17e); border: none; border-radius: 10px; padding: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.16);\">Click here &nbsp;·&nbsp; {{ checkCount }} of 10<\u002Fbutton>\n              <div style=\"margin-top: 14px; display: flex; justify-content: center; gap: 7px;\">\n                <sc-for list=\"{{ checkDots }}\" as=\"d\" hint-placeholder-count=\"10\">\n                  <span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{ d.bg }};\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top: 16px; font-size: 13px; color: #555555;\">{{ checkHint }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;revealSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:11,&quot;min&quot;:3,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;ms/char&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pacing&quot;},&quot;gateDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:600,&quot;min&quot;:0,&quot;max&quot;:2000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pacing&quot;}}\">\nclass Component extends DCLogic {\n  SCENARIO = \"Relationship Stress\";\n\n  CATEGORIES = [\n    { label: \"Mental health support\",         bg: \"#c0392b\" },\n    { label: \"Relationship\",                  bg: \"#d6247e\" },\n    { label: \"Family\",                        bg: \"#e0a800\" },\n    { label: \"Career & personal development\", bg: \"#1e8f4e\" }\n  ];\n\n  DISCLAIMER = [\n    \"Please read this disclaimer carefully before using the talk2us.ai chatbot.\",\n    \"The talk2us.ai chatbot is designed to provide general information and support for mental health, relationships, family matters, and other topics. The chatbot's responses should not be considered professional advice or a substitute for consultation with a licensed mental health professional, counselor, or other qualified experts.\",\n    \"talk2us.ai does not guarantee the accuracy, reliability, or completeness of the information provided by the chatbot. The chatbot's responses are generated based on general knowledge and should not be interpreted as specific recommendations or advice tailored to your unique circumstances.\",\n    \"By using the talk2us.ai chatbot, you acknowledge and agree that you are solely responsible for your actions and decisions based on the information provided by the chatbot. talk2us.ai, its owners, employees, affiliates, and partners shall not be held liable for any direct, indirect, incidental, consequential, or punitive damages arising from the use of the chatbot or any reliance on the information provided.\",\n    \"If you are experiencing a mental health crisis or emergency, please contact a mental health professional, call your local emergency number, or go to the nearest emergency room. The talk2us.ai chatbot is not intended for crisis intervention or emergency situations.\",\n    \"By using the talk2us.ai chatbot, you agree to these terms and conditions, and acknowledge that your use of the chatbot is at your own risk. If you do not agree with these terms, please discontinue use of the chatbot immediately.\",\n    \"To improve our services and provide a better user experience, we may collect certain information such as your conversations with talk2us.ai chatbot, location information limited to country and city, as well as browser type and version, operating system information. This information helps us understand how users interact with our chatbot and tailor our responses accordingly. Rest assured, we do not collect any personally identifiable information.\"\n  ];\n\n  LINES = [\n    { role: \"ai\",   text: \"Hi. Need to talk? I\\u2019m here to help.\" },\n    { role: \"user\", text: \"Hi, I\\u2019ve been feeling really disconnected lately. Since I started university, I barely see my family or my old friends anymore. We used to talk every day but now weeks go by without a real conversation. I\\u2019ve tried to make new friends here but it feels like everyone already has their groups, and I end up eating alone in the cafeteria more often than I\\u2019d like to admit. It\\u2019s making me feel really lonely.\" },\n    { role: \"ai\",   text: \"Hey, thanks for sharing this with me. What\\u2019s your name? It sounds really tough feeling so disconnected and lonely, especially with such a big life change like university. It\\u2019s okay to feel this way, and you\\u2019re not alone in this. What kind of support do you feel you need right now?\" },\n    { role: \"user\", text: \"My name is Jane. I think I just miss feeling close to people. I don\\u2019t really know how to talk about this with my family because I don\\u2019t want them to worry about me, and when I talk to my old friends it sometimes feels like we\\u2019ve drifted apart. I guess I would like some advice on how to feel less lonely and how to reconnect with people without feeling awkward or like I\\u2019m bothering them.\" },\n    { role: \"ai\",   text: \"Thanks for sharing, Jane. Missing closeness is natural, especially after such big changes. It\\u2019s brave to open up about this. What if we brainstorm small, gentle ways to reconnect? Maybe starting with short check-ins or sharing something personal could help bridge the gap. How do you usually feel when reaching out to them?\" },\n    { role: \"user\", text: \"Honestly, I usually feel nervous. With my family, I\\u2019m worried they\\u2019ll think I\\u2019m struggling more than I am if I tell them how lonely I\\u2019ve been feeling. With my old friends, I sometimes worry that we\\u2019ve grown apart and that reaching out will feel awkward. Because of that, I often put it off, and then even more time passes without talking to anyone. I know staying connected is important, but I\\u2019m not sure where to start.\" },\n    { role: \"ai\",   text: \"That nervousness makes a lot of sense, Jane. It\\u2019s really common to feel that way when reaching out after some distance. What if you start small? Maybe a simple message like, \\u201cHey, I was thinking about you,\\u201d to break the ice without pressure. How would it feel to try something like that? Would you like to explore ways to ease that nervousness?\" },\n    { role: \"user\", text: \"I think starting with a simple message could help. I guess I\\u2019m still worried about feeling rejected or awkward if the conversation doesn\\u2019t go well. Do you have any other suggestions for staying connected with family and friends, or for meeting new people at university when you\\u2019re feeling lonely?\" },\n    { role: \"ai\",   text: \"Jane, it\\u2019s completely normal to fear rejection, but reaching out is brave and meaningful. Besides messaging, could you try setting small goals like joining a club or study group? Shared interests can ease meeting new people naturally. What activities at university interest you? We can plan ways to connect that feel comfortable for you.\" },\n    { role: \"user\", text: \"Thanks, this gives me a lot to think about. I\\u2019m going to try starting with small steps like you suggested. I think that\\u2019s all I needed for now, but I appreciate your help.\" },\n    { role: \"ai\",   text: \"You\\u2019re very welcome, Jane. Taking small steps is powerful, and I\\u2019m really proud of you for being open to trying. Remember, it\\u2019s okay to take things at your own pace. Whenever you want to talk or explore more, I\\u2019m here for you. Take good care of yourself!\" }\n  ];\n\n  PLACEHOLDER = \"Type something to start a conversation.\";\n  THINK_MS = 900;\n  CHECK_AFTER = 5;\n  CHECK_CLICKS = 10;\n\n  state = {\n    screen: \"landing\",\n    messages: [],\n    idx: 0,\n    showTyping: false,\n    inputText: \"\",\n    busy: false,\n    gated: false,\n    done: false,\n    showCheck: false,\n    nextClicked: false,\n    checkCount: 0,\n    checkPassed: false\n  };\n\n  timers = [];\n\n  componentWillUnmount() { this.timers.forEach(clearTimeout); }\n\n  later(fn, ms) { const t = setTimeout(fn, ms); this.timers.push(t); return t; }\n\n  get revealMs() { return Math.max(2, this.props.revealSpeed ?? 11); }\n  get gateMs() { return Math.max(0, this.props.gateDelay ?? 600); }\n\n  scrollDown() {\n    const el = this.scrollEl;\n    if (el) el.scrollTop = el.scrollHeight;\n  }\n\n  signal(type) {\n    try { window.parent.postMessage({ type: type, scenario: this.SCENARIO }, \"*\"); } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    this.scrollDown();\n    const st = this.state;\n    const atEnd = st.screen === \"chat\" && st.idx >= this.LINES.length && !st.busy && !st.gated && !st.showCheck;\n    if (atEnd && !this.sentComplete) {\n      this.sentComplete = true;\n      this.signal(\"conversation_complete\");\n    }\n  }\n\n  // reveal one character at a time into the last message bubble\n  typeBubble(full, i, doneCb) {\n    this.setState(s => {\n      const msgs = s.messages.slice();\n      msgs[msgs.length - 1] = { ...msgs[msgs.length - 1], text: full.slice(0, i) };\n      return { messages: msgs };\n    });\n    if (i >= full.length) { doneCb(); return; }\n    this.later(() => this.typeBubble(full, i + 1, doneCb), this.revealMs);\n  }\n\n  typeInput(full, i, doneCb) {\n    this.setState({ inputText: full.slice(0, i) });\n    if (i >= full.length) { doneCb(); return; }\n    this.later(() => this.typeInput(full, i + 1, doneCb), Math.max(2, this.revealMs - 3));\n  }\n\n  finish(chars) {\n    const wait = Math.min(2200, this.gateMs + chars * 2);\n    this.setState({ gated: true, busy: false });\n    this.later(() => {\n      const st = this.state;\n      const needCheck = st.idx >= this.CHECK_AFTER && !st.checkPassed;\n      this._advancing = false;\n      this.setState({ gated: false, showCheck: needCheck });\n    }, wait);\n  }\n\n  reveal(i) {\n    if (this._advancing) return;\n    const line = this.LINES[i];\n    if (!line) return;\n    this._advancing = true;\n    this.setState({ busy: true, idx: i + 1 });\n\n    const push = () => this.setState(s => ({\n      messages: s.messages.concat([{ role: line.role, text: \"\" }])\n    }));\n\n    if (line.role === \"ai\") {\n      this.setState({ showTyping: true });\n      this.later(() => {\n        this.setState({ showTyping: false });\n        push();\n        this.later(() => this.typeBubble(line.text, 1, () => this.finish(line.text.length)), 30);\n      }, this.THINK_MS);\n    } else {\n      this.typeInput(line.text, 1, () => {\n        this.later(() => {\n          this.setState({ inputText: \"\" });\n          push();\n          this.later(() => this.typeBubble(line.text, line.text.length, () => this.finish(120)), 20);\n        }, 320);\n      });\n    }\n  }\n\n  renderVals() {\n    const st = this.state;\n    const atEnd = st.idx >= this.LINES.length && !st.busy && !st.gated && !st.showCheck;\n    const locked = st.busy || st.gated || st.showCheck;\n    const remaining = this.CHECK_CLICKS - st.checkCount;\n\n    return {\n      showLanding: st.screen === \"landing\",\n      showChatUI: st.screen !== \"landing\",\n      showModal: st.screen === \"disclaimer\",\n      categories: this.CATEGORIES.map((c, i) => ({\n        label: c.label,\n        bg: c.bg,\n        cursor: i === 0 ? \"pointer\" : \"default\",\n        anim: i === 0 ? \"t2u-pulse 1.6s ease-out infinite\" : \"none\",\n        onClick: i === 0 ? () => this.setState({ screen: \"disclaimer\" }) : () => {}\n      })),\n      disclaimer: this.DISCLAIMER,\n      showTyping: st.showTyping,\n      done: atEnd,\n      showCheck: st.showCheck,\n      checkCount: st.checkCount,\n      checkDots: Array.from({ length: this.CHECK_CLICKS }, (_, i) => ({\n        bg: i < st.checkCount ? \"#1f6b45\" : \"#dcdcdc\"\n      })),\n      checkHint: remaining > 0\n        ? remaining + (remaining === 1 ? \" click remaining.\" : \" clicks remaining.\")\n        : \"Thank you — returning to the conversation.\",\n      onCheckClick: () => {\n        if (!this.state.showCheck) return;\n        const n = this.state.checkCount + 1;\n        if (n >= this.CHECK_CLICKS) {\n          this.setState({ checkCount: n, checkPassed: true });\n          this.signal(\"attention_check_passed\");\n          this.later(() => this.setState({ showCheck: false }), 550);\n        } else {\n          this.setState({ checkCount: n });\n        }\n      },\n      scrollRef: el => { this.scrollEl = el; },\n\n      onAgree: () => {\n        this.setState({ screen: \"chat\" });\n        this.later(() => this.reveal(0), 250);\n      },\n      onNext: () => {\n        if (this._advancing) return;\n        const cur = this.state;\n        if (cur.busy || cur.gated || cur.showCheck) return;\n        if (cur.idx >= this.LINES.length) return;\n        if (!cur.nextClicked) this.setState({ nextClicked: true });\n        this.reveal(cur.idx);\n      },\n\n      messages: st.messages.map(m => ({\n        text: m.text,\n        justify: m.role === \"ai\" ? \"flex-start\" : \"flex-end\",\n        dir: m.role === \"ai\" ? \"row\" : \"row-reverse\",\n        avaText: m.role === \"ai\" ? \"T\" : \"You\",\n        avaBg: m.role === \"ai\" ? \"#a6e6bf\" : \"#f6c9db\",\n        avaColor: m.role === \"ai\" ? \"#1f6b45\" : \"#a34878\"\n      })),\n\n      inputDisplay: st.inputText || this.PLACEHOLDER,\n      inputColor: st.inputText ? \"#232323\" : \"#a8a8a8\",\n\n      nextLabel: atEnd ? \"Conversation complete\" : (locked ? \"Please wait\\u2026\" : \"Next \\u2192\"),\n      nextDisabled: locked || atEnd,\n      nextAnim: (!locked && !atEnd && !st.nextClicked) ? \"t2u-pulse-next 1.6s ease-out infinite\" : \"none\",\n      nextBg: atEnd ? \"#a6e6bf\" : \"linear-gradient(90deg, #f9a8c0, #f6b17e)\",\n      nextColor: atEnd ? \"#1f6b45\" : \"#fff\",\n      nextCursor: (locked || atEnd) ? \"default\" : \"pointer\",\n      nextOpacity: locked ? 0.5 : 1,\n      hintText: atEnd\n        ? \"You may now continue to the next section of the survey.\"\n        : (locked ? \"\" : \"Click Next to continue the conversation.\")\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
